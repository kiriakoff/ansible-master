server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Canonical address: the page is served with 200 here. Traefik's errors
    # middleware also requests this path when the main app answers with 404.
    location = /notfound {
        try_files /404.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Any other miss still renders the same page (with a 404 status).
    error_page 404 /404.html;
}
