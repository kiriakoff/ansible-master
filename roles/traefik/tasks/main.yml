---
- name: Create volume mount directory
  ansible.builtin.file:
    path: "{{ app_path }}"
    state: directory
    mode: "u=rwx,g=rx,o=rx"

- name: Render docker-compose.yml and traefik.yml from templates
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ app_path }}/{{ item }}"
    mode: "u=rw,g=r,o=r"
  loop:
    - docker-compose.yml
    - traefik.yml

- name: Ensure acme.json exists with correct permissions
  ansible.builtin.file:
    path: "{{ app_path }}/acme.json"
    state: file
    mode: "u=rw,go="

- name: Copy the 404 page for the notfound service
  ansible.builtin.copy:
    src: notfound/
    dest: "{{ app_path }}/notfound/"
    mode: "u=rw,g=r,o=r"

- name: Start the container
  community.docker.docker_compose_v2:
    project_src: "{{ app_path }}"
