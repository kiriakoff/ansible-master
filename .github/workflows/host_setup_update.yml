name: 'Host setup: Update'

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Host to update (IP or hostname)'
        required: true
      update_keyring:
        description: 'Update pacman keyring before system upgrade'
        type: boolean
        default: false
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache-dependency-path: playbooks/requirements/runner.txt
          cache: 'pip'

      - name: Install Ansible and dependencies
        run: |
          if ! ansible-galaxy collection list community.general 2>/dev/null; then
            python -m pip install --upgrade pip
            pip install -r playbooks/requirements/runner.txt
            ansible-galaxy collection install -r playbooks/requirements/runner.yml
          fi

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${ANSIBLE_SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ inputs.host }} >> ~/.ssh/known_hosts 2>/dev/null || true
        env:
          ANSIBLE_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}

      - name: Write SSH users JSON to file
        run: |
          echo -n '"ssh_user_map": ' >> extra_vars.json
          echo '${{ vars.SSH_USER_MAP }}' >> extra_vars.json

      - name: Run Ansible playbook
        env:
          ANSIBLE_PYTHON_INTERPRETER: venv/bin/python3
          ANSIBLE_CALLBACK_WHITELIST: profile_tasks
          # workflow_dispatch passes the host input; a push to main applies to
          # every inventory host.
          LIMIT: ${{ inputs.host || 'all' }}
        run: |
          ansible-playbook \
            --limit "$LIMIT" \
            --extra-vars @extra_vars.json \
            --extra-vars 'update_keyring=${{ inputs.update_keyring }}' \
            playbooks/bootstrap.yml
