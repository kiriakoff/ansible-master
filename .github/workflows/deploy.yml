name: Deploy role

on:
  repository_dispatch:
    types: [Deploy role]
  workflow_dispatch:
    inputs:
      role:
        description: 'Ansible role to deploy'
        required: true
        type: string
      limit:
        description: 'Hosts to limit the playbook run to (optional)'
        required: false
        type: string
        default: 'all'
  workflow_call:
    inputs:
      role:
        description: 'Ansible role to deploy'
        required: true
        type: string
      limit:
        description: 'Hosts to limit the playbook run to (optional)'
        required: false
        type: string
        default: 'all'

jobs:
  deploy:
    name: Deploy ${{ inputs.role || github.event.inputs.role || github.event.client_payload.role }}
    runs-on: ubuntu-latest
    environment: production
    env:
      ROLE: ${{ inputs.role || github.event.inputs.role || github.event.client_payload.role }}
      LIMIT: ${{ inputs.limit || github.event.inputs.limit || github.event.client_payload.limit || 'all' }}
    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache-dependency-path: playbooks/requirements/runner.txt
          cache: 'pip'

      - name: Compute Ansible cache key
        id: ansible-key
        run: echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"

      # Deliberately rough cache: one key per month. Within a month the venv
      # is reused as-is; on the first run of a new month the previous venv is
      # restored (restore-keys) and pip reconciles it with the requirements.
      - name: Cache Ansible environment
        uses: actions/cache@v6
        id: ansible-cache
        with:
          path: ~/ansible-venv
          key: ansible-${{ runner.os }}-py3.13-${{ steps.ansible-key.outputs.month }}
          restore-keys: |
            ansible-${{ runner.os }}-py3.13-

      - name: Install Ansible
        if: steps.ansible-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv ~/ansible-venv
          ~/ansible-venv/bin/python -m pip install --upgrade pip
          ~/ansible-venv/bin/pip install -r playbooks/requirements/runner.txt
          ~/ansible-venv/bin/ansible-galaxy collection install -r playbooks/requirements/runner.yml

      - name: Put Ansible on PATH
        run: echo "$HOME/ansible-venv/bin" >> "$GITHUB_PATH"

      - name: Set up SSH
        run: |
          echo "${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Write gh secrets and vars to files
        run: |
          echo -n '"gh_vars": ' >> vars.json
          echo '${{ toJson(vars) }}' | sed 's|\\r\\n|\\n|g' >> vars.json
          echo -n '"gh_secrets": ' >> secrets.json
          echo '${{ toJson(secrets) }}' | sed 's|\\r\\n|\\n|g' >> secrets.json

      - name: Run Ansible Playbook
        env:
          ANSIBLE_USER: ansible
          ANSIBLE_HOST_KEY_CHECKING: False
        run: |
          ansible-playbook \
          --extra-vars "role_to_deploy=${{ env.ROLE }}" \
          --extra-vars "gh_username=${{ github.repository_owner }}" \
          --extra-vars "@vars.json" \
          --extra-vars "@secrets.json" \
          --private-key private_key.pem \
          --limit "${{ env.LIMIT }}" \
          playbooks/deploy.yml
